.add-btn{

/* REASONS */

/* ACCORDION */
.accordion-item{border-top:1px solid #ddd;}
.accordion-header{

display:flex;
justify-content:space-between;
font-weight:bold;
}
.accordion-content{
display:none;
padding:15px;

@media(max-width:900px){
.product-container{flex-direction:column;padding:30px;}

/* LOAD PRODUCT */
const params=new URLSearchParams(window.location.search);
const id=params.get("id");
const product=products[id];

if(product){
document.getElementById("category").innerText=product.category;
document.getElementById("productName").innerText=product.name;
document.getElementById("tagline").innerText=product.tagline;
document.getElementById("productPrice").innerText=product.price;
document.getElementById("mainImage").src=product.images[0];

const thumbContainer=document.getElementById("thumbnails");
product.images.forEach(img=>{
let image=document.createElement("img");
image.src=img;
image.onclick=()=>document.getElementById("mainImage").src=img;
thumbContainer.appendChild(image);
});

const reasonsList=document.getElementById("reasonsList");
product.reasons.forEach(reason=>{
let li=document.createElement("li");
li.innerText=reason;
reasonsList.appendChild(li);
});

const accordion=document.getElementById("accordionSection");
const sections=[
{title:"DESCRIPTION",content:product.description},
{title:"BENEFITS",content:product.benefits},
{title:"HOW TO USE",content:product.usage}
];

sections.forEach(sec=>{
let item=document.createElement("div");
item.className="accordion-item";
item.innerHTML=`
<div class="accordion-header">${sec.title} <span>+</span></div>
<div class="accordion-content">${sec.content}</div>
`;
accordion.appendChild(item);
});
}

/* Quantity */
let quantity=1;
function increase(){quantity++;document.getElementById("qty").innerText=quantity;}
function decrease(){if(quantity>1){quantity--;document.getElementById("qty").innerText=quantity;}}

/* Accordion */
document.addEventListener("click",function(e){
if(e.target.classList.contains("accordion-header")){
let content=e.target.nextElementSibling;
content.style.display=content.style.display==="block"?"none":"block";
}
});

function addToCart() {
    if (!product) return;

    let cart = JSON.parse(localStorage.getItem("dermalyx_cart")) || [];
    let currentQty = parseInt(document.getElementById("qty").innerText);

    let productId = "facewash_" + id;

    let existingItem = cart.find(item => item.id === productId);

    if (existingItem) {
        existingItem.quantity += currentQty;
    } else {
        let numericPrice = parseInt(product.price.replace(/[^0-9]/g, ''));

        cart.push({
            id: productId,
            name: product.name,
            price: numericPrice,
            img: product.images[0],
            quantity: currentQty
        });
    }

    localStorage.setItem("dermalyx_cart", JSON.stringify(cart));
    alert(product.name + " (" + currentQty + ") added to cart successfully 🛒");
}
</script>
