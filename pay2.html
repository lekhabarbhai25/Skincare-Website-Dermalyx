<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body{
  background:#0f0f0f;
  min-height:100vh;
  color:#fff;
}

.checkout-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
}

.checkout-container{
  background:#ffffff;
  color:#000;
  width:100%;
  max-width:1200px;
  border-radius:15px;
  padding:30px;
  box-shadow:0 15px 40px rgba(0,0,0,0.6);
}

.checkout-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding-bottom:15px;
  margin-bottom:25px;
}

.checkout-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:25px;
}

.summary{
  background:#f5f5f5;
  padding:20px;
  border-radius:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.total{
  font-size:20px;
  font-weight:bold;
}

.payment-section{
  background:#f9f9f9;
  padding:20px;
  border-radius:12px;
}

.pay-btn{
  width:100%;
  padding:14px;
  background:#000;
  border:none;
  color:#fff;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:15px;
}

.pay-btn:hover{
  background:#333;
}

.methods{
  display:none;
}

.method{
  background:#ffffff;
  padding:12px;
  border-radius:8px;
  margin-bottom:10px;
  border:1px solid #ddd;
  opacity:0.7;
  cursor:not-allowed;
}

.note{
  text-align:center;
  font-size:12px;
  color:#555;
}

@media(max-width:900px){
  .checkout-grid{
    grid-template-columns:1fr;
  }
}
</style>

</head>

<body>

<div class="checkout-page">

<div class="checkout-container">

<div class="checkout-header">
  <h2>Checkout</h2>
  <div>🔒 100% Secure Payments</div>
</div>

<div class="checkout-grid">

<!-- Summary -->
<div class="summary">
  <h3>Order Summary</h3>
  <div class="row"><span>Products</span><span>₹<span id="productPrice">0</span></span></div>
  <div class="row"><span>Delivery</span><span>₹<span id="deliveryPrice">0</span></span></div>
  <hr>
  <div class="row total"><span>Total Amount</span><span>₹<span id="paymentTotal">0</span></span></div>
</div>

<!-- Payment -->
<div class="payment-section">
  <h3>Payment Method</h3>

  <!-- ✅ BUTTON FIXED -->
  <button class="pay-btn" onclick="checkout()">Proceed To Pay</button>

  <div class="methods" id="methods">
    <div class="method">💵 Cash On Delivery (COD)</div>
    <div class="method">📱 UPI (GPay / PhonePe / Paytm)</div>
    <div class="method">💳 Debit / Credit Card</div>
    <div class="method">🏦 Net Banking</div>
    <p class="note">* Payment options are currently disabled</p>
  </div>

</div>

</div>

</div>

</div>

<script>
// ================= LOAD PRICE FROM LOCALSTORAGE =================
window.onload = function() {
    let productVal = localStorage.getItem("productPrice") || 0;
    let deliveryVal = localStorage.getItem("deliveryPrice") || 0;
    let totalVal = localStorage.getItem("totalAmount") || 0;

    document.getElementById("productPrice").innerText = productVal;
    document.getElementById("deliveryPrice").innerText = deliveryVal;
    document.getElementById("paymentTotal").innerText = totalVal;
};

// ================= SIMULATED BACKEND CHECKOUT =================
function checkout() {
    // Check if user is "logged in" (simulated)
    const user = JSON.parse(localStorage.getItem("user")) || { name: "Guest" };

    // 1. Show the payment methods (as per your existing logic)
    document.getElementById("methods").style.display = "block";

    // 2. Clear the cart since order is placed
    localStorage.removeItem("dermalyx_cart");

    // 3. Professional Confirmation Alert
    setTimeout(() => {
        alert("✨ ORDER CONFIRMED! ✨\n\nThanks for shopping with DERMALYX, " + (user.username || "valuable customer") + "!\n\nYour premium products are being prepared for delivery.");
        window.location.href = "home.html"; // Redirect to home after confirmation
    }, 500);
}
</script>

</body>
</html>
