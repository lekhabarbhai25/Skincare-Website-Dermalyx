<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#f6f6f6;}

.navbar{
display:flex;
justify-content:space-between;
padding:15px 40px;
background:white;
}

.logo{font-weight:bold;font-size:22px;}

.container{
display:flex;
gap:60px;
padding:60px;
}

/* IMAGE */
.image-section{flex:1;}
.main-img{
width:100%;
max-width:450px;

}
.thumbs{
display:flex;
gap:10px;

/* INFO */

.category{font-size:12px;color:#777;letter-spacing:2px;}
h1{margin:10px 0;}
.price{font-size:22px;font-weight:bold;margin:10px 0;}
.rating{color:orange;margin-bottom:15px;}

.quantity{display:flex;gap:15px;margin-bottom:20px;}
.quantity button{
width:35px;height:35px;border:none;background:#ddd;font-size:18px;cursor:pointer;
}

.add-btn{
width:100%;
padding:15px;
background:black;
color:white;
border:none;
margin-bottom:20px;
}

/* Accordion */
.accordion-item{border-top:1px solid #ddd;}
.accordion-header{
padding:15px;
cursor:pointer;
display:flex;
justify-content:space-between;
}
.accordion-content{
display:none;

@media(max-width:900px){
.container{flex-direction:column;padding:30px;}
}
</style>

const id=new URLSearchParams(window.location.search).get("id");
const product=products[id];

if(product){
document.getElementById("category").innerText=product.category;
document.getElementById("name").innerText=product.name;
document.getElementById("price").innerText=product.price;
document.getElementById("mainImg").src=product.images[0];

const thumb=document.getElementById("thumbContainer");
product.images.forEach(img=>{
let image=document.createElement("img");
image.src=img;
image.onclick=()=>document.getElementById("mainImg").src=img;
thumb.appendChild(image);
});

const acc=document.getElementById("accordion");
[
{title:"DESCRIPTION",content:product.description},
{title:"BENEFITS",content:product.benefits},
{title:"HOW TO USE",content:product.usage}
].forEach(sec=>{
let div=document.createElement("div");
div.className="accordion-item";
div.innerHTML=`
<div class="accordion-header">${sec.title} +</div>
<div class="accordion-content">${sec.content}</div>
`;
acc.appendChild(div);
});
}

/* Quantity */
let quantity=1;
function inc(){quantity++;document.getElementById("qty").innerText=quantity;}
function dec(){if(quantity>1){quantity--;document.getElementById("qty").innerText=quantity;}}

/* Accordion */
document.addEventListener("click",e=>{
if(e.target.classList.contains("accordion-header")){
let content=e.target.nextElementSibling;
content.style.display=content.style.display==="block"?"none":"block";
}
});

function addToCart() {
    if (!product) return;

    let cart = JSON.parse(localStorage.getItem("dermalyx_cart")) || [];

    let currentQty = parseInt(document.getElementById("qty").innerText);

    // Check existing item
    let existingItem = cart.find(item => item.id == id);

    if (existingItem) {
        existingItem.quantity += currentQty;
    } else {
        let numericPrice = parseInt(product.price.replace(/[^0-9]/g, ''));

        cart.push({
            id: id,
            name: product.name,
            price: numericPrice,
            img: product.images[0],
            quantity: currentQty
        });
    }

    localStorage.setItem("dermalyx_cart", JSON.stringify(cart));
    alert(product.name + " added to cart! 🛒");
}
