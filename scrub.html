<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dermalyx | Scrub Collection</title>
<style>
/* ===== GLOBAL ===== */
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body{background:#f4f4f4;}

/* ===== NAVBAR ===== */
.navbar{
  display:flex; justify-content:space-between; align-items:center;
  padding:15px 50px; background:white; position:sticky; top:0; z-index:1000;
}
.logo{ font-weight:bold; font-size:22px; letter-spacing:2px; color:#022f30; }
nav{display:flex; gap:25px;}
nav a{text-decoration:none; color:#022f30; font-size:14px;}

/* ===== HERO ===== */
.hero{height:50vh; background:url('combine_scrub.jpg') center/cover; display:flex; align-items:center; justify-content:center; color:white; position:relative;}
.hero::after{content:""; position:absolute; inset:0; background:rgba(0,0,0,0.4);}
.hero h1{position:relative; font-size:clamp(28px,5vw,60px); z-index: 1;}

/* ===== PRODUCTS ===== */
.products{ display:grid; grid-template-columns:repeat(3,1fr); gap:30px; padding:60px; }
.product{ position:relative; border-radius:15px; overflow:hidden; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,0.15); transition:0.3s; background: white;}
.product img{width:100%; height:280px; object-fit:cover;}
.product:hover{transform:translateY(-8px);}
.price{ position:absolute; bottom:15px; left:15px; background:rgba(0,0,0,0.7); color:white; padding:8px 12px; border-radius:6px; }
.cart-btn{ position:absolute; bottom:15px; right:15px; background:black; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; }
.wish{ position:absolute; top:12px; right:12px; }
.wish button{ border:none; background:white; border-radius:50%; padding:6px 10px; cursor:pointer; }
.wish button.liked{background:deeppink; color:white;}

/* ===== FOOTER ===== */
.footer{ background:#111; color:#ddd; padding:60px 50px 20px; margin-top:50px; }
.footer-container{ display:grid; grid-template-columns:repeat(4,1fr); gap:40px; }
.footer-col h3, .footer-col h4{ margin-bottom:15px; color:white; }
.footer-col a{ display:block; color:#bbb; text-decoration:none; margin-bottom:8px; font-size:14px; }
.footer-bottom{ text-align:center; margin-top:40px; padding-top:20px; border-top:1px solid #333; font-size:14px; color:#777; }

@media(max-width:1024px){ .products{grid-template-columns:repeat(2,1fr);} }
@media(max-width:600px){ .products{grid-template-columns:1fr; padding:30px;} }
</style>
</head>
<body>

<header class="navbar">
    <div class="logo">DERMALYX</div>
    <nav>
        <a href="home.html">Home</a>
        <a href="product.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="term.html">Privacy</a>
        <a href="login.html">Login</a>
        <a href="admin.html">Admin</a>
    </nav>
</header>

<section class="hero">
    <h1>SCRUB COLLECTION</h1>
</section>

<section class="products" id="productGrid"></section>

<footer class="footer">
    <div class="footer-container">
        <div class="footer-col"><h3>DERMALYX</h3><p>Premium skincare products designed for radiant and healthy skin.</p></div>
        <div class="footer-col"><h4>Quick Links</h4><a href="home.html">Home</a><a href="cart.html">Cart</a></div>
        <div class="footer-col"><h4>Customer Care</h4><a href="#">Shipping Policy</a><a href="#">Privacy Policy</a></div>
        <div class="footer-col"><h4>Follow Us</h4><p>Instagram</p><p>Facebook</p></div>
    </div>
    <div class="footer-bottom">©️ 2026 Dermalyx. All Rights Reserved.</div>
</footer>

<script>
    // 1. Data Dictionary for the Scrum Collection
    const products = [
        { id:1, name:"Coffee Scrub", price:299, img: "scrub1.jpg" },
        { id:2, name:"Pearl Scrub", price:349, img:"scrub2.jpg" },
        { id:3, name:"De-Tan Scrub", price:279, img:"scrub3.jpg" },
        { id:4, name:"Korean Glass Scrub", price:399, img:"scrub4.jpg" },
        { id:5, name:"Charcoal Scrub", price:319, img:"scrub5.jpg" },
        { id:6, name:"Vitamin C Scrub", price:359, img:"scrub6.jpg" }
    ];

    const grid = document.getElementById("productGrid");

    // 2. Loop to Generate Product HTML dynamically
    products.forEach(product => {
        const div = document.createElement("div");
        div.className = "product";
        div.innerHTML = `
            <img src="${product.img}">
            <div class="price">₹${product.price}</div>
            <div class="wish"><button class="wish-heart">❤</button></div>
            <button class="cart-btn">ADD</button>
        `;

        // ==========================================
        // ADDITION 1: WISHLIST TOGGLE LOGIC
        // ==========================================
        // Find the specific heart button within this product card
        const heartBtn = div.querySelector(".wish-heart");

        // Add the click event listener
        heartBtn.addEventListener("click", (e) => {
            // Important: Stop this click from also opening the product details page
            e.stopPropagation(); 
            
            // Toggle the 'liked' CSS class (already defined in your <style> as deeppink)
            heartBtn.classList.toggle("liked");
            
            // (Optional) Add a visual confirmation for the user
            if(heartBtn.classList.contains("liked")) {
                console.log(product.name + " added to wishlist! 💖");
            } else {
                console.log(product.name + " removed from wishlist.");
            }
        });
        // ==========================================

        // 3. Add to Cart Logic (Simulated Backend)
        div.querySelector(".cart-btn").addEventListener("click", (e) => {
            e.stopPropagation(); // Prevents details page from opening
            let cart = JSON.parse(localStorage.getItem("dermalyx_cart")) || [];
            
            const existing = cart.find(item => item.id === product.id);
            
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            localStorage.setItem("dermalyx_cart", JSON.stringify(cart));
            alert(product.name + " added to cart! 🛒");
        });

        // 4. Click to View Details Page Logic
        div.addEventListener("click", e => {
            // If they clicked ADD or the HEART, do NOT redirect them
            if(e.target.closest(".cart-btn") || e.target.closest(".wish-heart")) return;
            // Otherwise, open the specific product details page
            window.location.href = "product-details.html?id=" + product.id;
        });

        grid.appendChild(div);
    });
</script>
</body>
</html>
