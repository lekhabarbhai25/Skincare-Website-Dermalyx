<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#f6f6f6;color:#222;}

.navbar{
display:flex;
justify-content:space-between;

.logo{font-size:22px;font-weight:bold;letter-spacing:2px;}

.product-container{

/* IMAGE */

}
.thumbnail-container{
display:flex;
gap:10px;
margin-top:15px;

.thumbnail-container img{
width:70px;

cursor:pointer;
border-radius:6px;
border:2px solid transparent;
}
.thumbnail-container img:hover{
border:2px solid black;
}

/* INFO */
.info-section{flex:1;}
.category{
font-size:12px;
letter-spacing:2px;
color:#777;
margin-bottom:10px;
}
h1{font-size:32px;margin-bottom:10px;}
.price{font-size:24px;font-weight:bold;margin:10px 0;}
.tagline{color:#666;margin-bottom:10px;}
.rating{color:#ff9900;margin-bottom:15px;}

.quantity{
display:flex;
gap:15px;
align-items:center;
margin-bottom:20px;
}
.quantity button{
width:35px;height:35px;border:none;background:#ddd;font-size:18px;cursor:pointer;
}

.add-btn{
width:100%;
padding:15px;
background:black;
color:white;
border:none;
cursor:pointer;
margin-bottom:20px;
}

/* REASONS */
.reasons ul{padding-left:18px;margin:10px 0;}
.reasons li{margin-bottom:8px;color:#555;}

/* ACCORDION */
.accordion-item{border-top:1px solid #ddd;}
.accordion-header{
padding:15px;
cursor:pointer;
display:flex;
justify-content:space-between;
font-weight:bold;
}
.accordion-content{
display:none;
padding:15px;
color:#555;
}

@media(max-width:900px){
.product-container{flex-direction:column;padding:30px;}
.main-img{max-width:100%;}
}
</style>

/* LOAD PRODUCT */
const params=new URLSearchParams(window.location.search);
const id=params.get("id");
const product=products[id];

if(product){
document.getElementById("category").innerText=product.category;
document.getElementById("productName").innerText=product.name;
document.getElementById("tagline").innerText=product.tagline;
document.getElementById("productPrice").innerText=product.price;
document.getElementById("mainImage").src=product.images[0];

const thumbContainer=document.getElementById("thumbnails");
product.images.forEach(img=>{
let image=document.createElement("img");
image.src=img;
image.onclick=()=>document.getElementById("mainImage").src=img;
thumbContainer.appendChild(image);
});

const reasonsList=document.getElementById("reasonsList");
product.reasons.forEach(reason=>{
let li=document.createElement("li");
li.innerText=reason;
reasonsList.appendChild(li);
});

const accordion=document.getElementById("accordionSection");
const sections=[
{title:"DESCRIPTION",content:product.description},
{title:"BENEFITS",content:product.benefits},
{title:"HOW TO USE",content:product.usage}
];

sections.forEach(sec=>{
let item=document.createElement("div");
item.className="accordion-item";
item.innerHTML=`
<div class="accordion-header">${sec.title} <span>+</span></div>
<div class="accordion-content">${sec.content}</div>
`;
accordion.appendChild(item);
});
}

/* Quantity */
let quantity=1;
function increase(){quantity++;document.getElementById("qty").innerText=quantity;}
function decrease(){if(quantity>1){quantity--;document.getElementById("qty").innerText=quantity;}}

/* Accordion */
document.addEventListener("click",function(e){
if(e.target.classList.contains("accordion-header")){
let content=e.target.nextElementSibling;
content.style.display=content.style.display==="block"?"none":"block";
}
});

function addToCart() {
    if (!product) return;

    let cart = JSON.parse(localStorage.getItem("dermalyx_cart")) || [];

    let currentQty = parseInt(document.getElementById("qty").innerText);

    // Check existing item
    let existingItem = cart.find(item => item.id == id);

    if (existingItem) {
        existingItem.quantity += currentQty;
    } else {
        let numericPrice = parseInt(product.price.replace(/[^0-9]/g, ''));

        cart.push({
            id: id,
            name: product.name,
            price: numericPrice,
            img: product.images[0],
            quantity: currentQty
        });
    }

    localStorage.setItem("dermalyx_cart", JSON.stringify(cart));
    alert(product.name + " added to cart! 🛒");
}
